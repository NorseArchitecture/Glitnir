services:
  postgres:
    image: postgres:19beta2
    environment:
      POSTGRES_DB: spike
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: spike
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spike"]
      interval: 2s
      timeout: 3s
      retries: 30
